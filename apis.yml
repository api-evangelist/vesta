aid: vesta
name: Vesta
description: >-
  Vesta is an AI-native mortgage Loan Origination System (LOS) — a modern,
  open system-of-record platform that orchestrates the loan manufacturing
  process through configurable software workflows and AI agents that run real
  loans end to end. Founded in 2020 by former Blend employees Mike Yu and Devon
  Yang and headquartered in San Francisco, Vesta gives mortgage lenders a
  cloud, API-and-integration-friendly LOS to replace legacy origination
  systems, connecting to the broader mortgage technology ecosystem. The company
  raised an Andreessen Horowitz (a16z)-led Series A. Vesta sells to lenders
  through a demo/partner-signup enterprise motion and does not currently expose
  a public self-serve developer API, portal, or documentation surface.
